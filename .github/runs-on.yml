runners:
  xlarge-x64:
    cpu: 4
    ram: 16
    family: ["m7a", "m7i"]
    image: ubuntu24-full-x64
    volume: 80gb:gp3
    spot: true
  xlarge-arm64:
    cpu: 4
    ram: 16
    family: ["m7g"]
    image: ubuntu24-full-arm64
    volume: 80gb:gp3
    spot: true
  # 2× the xlarge tier — used by the Rust-heavy build workflows (release
  # backend / dashboard images, precompile binaries) where the bottleneck
  # is parallel cargo codegen of first-party crates. Matches AWS
  # m7a/m7i/m7g .2xlarge sizing (8 vCPU / 32 GB).
  #
  # Keys quoted so YAML treats the digit-leading name as a string. Without
  # the quotes the bare key '2xlarge-x64' was being read as a non-string
  # scalar by runs-on.com's parser and the runner spec lookup failed with
  # 'runner spec 2xlarge-x64 not found' (commit 351e8b05e).
  "2xlarge-x64":
    cpu: 8
    ram: 32
    family: ["m7a", "m7i"]
    image: ubuntu24-full-x64
    volume: 80gb:gp3
    spot: true
  "2xlarge-arm64":
    cpu: 8
    ram: 32
    family: ["m7g"]
    image: ubuntu24-full-arm64
    volume: 80gb:gp3
    spot: true

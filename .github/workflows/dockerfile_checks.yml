name: Dockerfile Checks
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  # Reusable so the release workflow can gate its image builds on this.
  workflow_call:
  push:
    # `release` is covered by the gating job in release_self_hosted_images.yml,
    # so listing it here would just run this twice per release.
    branches: [enhanced]
  pull_request:
    branches: ["**"]

jobs:
  check:
    name: Dockerfile Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      # Invoked through `python` rather than relying on the shebang and the
      # executable bit. This repo is largely authored on Windows, where git
      # cannot set that bit, so a new gate script lands as mode 100644 and
      # dies here with a bare `Permission denied` (exit 126) that is invisible
      # until CI runs. Both scripts are committed 100755 as well, so either
      # invocation works; this just stops the bit from being load-bearing.
      - run: python scripts/check_dockerfile_js_toolchain.py

      # Replaces pnpm's `blockExoticSubdeps`, which this fork must disable to
      # keep `pnpm deploy` working in the dashboard images. See the comment on
      # that setting in npm-packages/pnpm-workspace.yaml.
      - run: python scripts/check_exotic_subdeps.py

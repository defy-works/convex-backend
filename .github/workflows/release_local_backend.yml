name: Release Self-Hosted Backend

on:
  workflow_call:
    outputs:
      backend_x64_digest:
        description: "x64 image digest"
        value: ${{ fromJson(jobs.read.outputs.result).digest.backend-x64 }}
      backend_arm64_digest:
        description: "arm64 image digest"
        value: ${{ fromJson(jobs.read.outputs.result).digest.backend-arm64 }}

env:
  IMAGE_NAMESPACE:
    ${{ vars.GHCR_NAMESPACE != '' && vars.GHCR_NAMESPACE ||
    github.repository_owner }}
  BACKEND_IMAGE_NAME:
    ${{ vars.BACKEND_IMAGE_NAME != '' && vars.BACKEND_IMAGE_NAME ||
    'convex-backend' }}

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build:
    name: Build backend image
    strategy:
      # One arch dying must not cancel the other. These builds run 20+ minutes
      # on spot runners, so a reclaimed instance is a routine event — with
      # fail-fast on, it throws away a healthy sibling build and doubles the
      # work on re-run. A real code error fails both arches anyway.
      fail-fast: false
      matrix:
        arch: [x64, arm64]
    # `spot=false` as an inline label override rather than a named runner
    # spec: runs-on resolves named specs from its own cached config, not from
    # the branch being built, so a newly added class fails to resolve
    # ("runner spec ... not found") and the job dies in seconds. Overriding a
    # parameter on an existing, resolvable spec sidesteps that entirely.
    #
    # On-demand because this is the longest image build (~25 min) and spot
    # reclamation killed it mid-compile on two consecutive runs, so it never
    # reached the publish step.
    #
    # `cpu`/`ram` are overridden inline for the same reason as `spot`, and
    # because the `xlarge-*` spec is only 4 vCPU / 16 GB despite the name.
    #
    # Sizing up is close to cost-neutral rather than more expensive: EC2 bills
    # per second and price scales linearly with size inside a family, so 2x the
    # cores at half the wall clock is the same bill. The only real premium is
    # the fraction of the build that does not parallelize (link tail, image
    # push, apt/npm downloads). 8 vCPU keeps that premium small; 16 was tested
    # against and rejected as paying ~1.4x for diminishing returns, because a
    # Rust release build stops scaling well past ~8 cores on this workspace.
    #
    # 8 vCPU / 32 GB maps to m7a/m7i/m7g `.2xlarge`, which exist in every
    # region this fork builds in. The ratio is forced: the m7 families are
    # fixed at 4 GB per vCPU, so `ram` is not an independent cost lever here.
    runs-on:
      "runs-on=${{ github.run_id }}-${{ matrix.arch }}/runner=xlarge-${{
      matrix.arch }}/cpu=8/ram=32/spot=false"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get UTC ISO8601 timestamp
        run:
          echo "COMMIT_TIMESTAMP=$(git log -1 --format='%aI' | date -f - --utc
          '+%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV

      - name: Build and push backend
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build-image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          context: .
          file: self-hosted/docker-build/Dockerfile.backend
          tags: |
            ghcr.io/${{ env.IMAGE_NAMESPACE }}/${{ env.BACKEND_IMAGE_NAME }}
          # Fork divergence: upstream sets `no-cache: true` here, because a
          # *shared* build cache is not safe for a release build — a poisoned
          # cache entry could put incorrect content into the image. This fork
          # caches into its own private RunsOn S3 bucket, which is not shared
          # with untrusted writers, and keeps the cache for build speed.
          cache-from: |
            type=s3,name=convex-backend-${{ matrix.arch }}-${{ github.sha }},prefix=cache/buildkit/,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
            type=s3,name=convex-backend-${{ matrix.arch }}-${{ github.ref_name }},prefix=cache/buildkit/,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          cache-to: |
            type=s3,name=convex-backend-${{ matrix.arch }}-${{ github.sha }},mode=max,prefix=cache/buildkit/,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
            type=s3,name=convex-backend-${{ matrix.arch }}-${{ github.ref_name }},mode=max,prefix=cache/buildkit/,region=${{ vars.AWS_REGION }},bucket=${{ vars.RUNS_ON_S3_BUCKET_CACHE }}
          outputs: push-by-digest=true,type=image,push=true
          provenance: false
          build-args: |
            VERGEN_GIT_SHA=${{ github.sha }}
            VERGEN_GIT_COMMIT_TIMESTAMP=${{ env.COMMIT_TIMESTAMP }}

      - name: Write digest
        uses: cloudposse/github-action-matrix-outputs-write@ed06cf3a6bf23b8dce36d1cf0d63123885bb8375 # v1
        id: digest
        with:
          matrix-step-name: ${{ github.job }}
          matrix-key: backend-${{ matrix.arch }}
          outputs: |-
            digest: ${{ steps.build-image.outputs.digest }}

  read:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: cloudposse/github-action-matrix-outputs-read@33cac12fa9282a7230a418d859b93fdbc4f27b5a # v1
        id: read
        with:
          matrix-step-name: build
    outputs:
      result: "${{ steps.read.outputs.result }}"
